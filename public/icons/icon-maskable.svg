<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Code Scanner">
  <title>Code Scanner</title>
  <!-- Maskable source. Android crops this to an arbitrary shape (circle,
       squircle, rounded square), so the brand colour must reach every edge and
       every drawn pixel must stay inside the inner 80% safe circle (radius
       204.8 from the centre).

       The background is a plain full-bleed square, NOT an inset plate. The
       previous version drew a 400x400 blue plate on a white canvas; once the
       launcher applied its circular mask, that white canvas showed as a ring
       around the plate on all four sides.

       The glyph below is the old plate's glyph scaled 1.25x about the centre so
       it keeps the visual weight it had inside that plate. Its outermost ink is
       186.5 from the centre (91% of the safe radius); the corner brackets are
       the binding geometry, not the scan bar. -->
  <rect width="512" height="512" fill="#3498db" />
  <g fill="none" stroke="#ffffff" stroke-width="25" stroke-linecap="square">
    <path d="M166 123.5 H156 A32.5 32.5 0 0 0 123.5 156 V166" />
    <path d="M346 123.5 H356 A32.5 32.5 0 0 1 388.5 156 V166" />
    <path d="M166 388.5 H156 A32.5 32.5 0 0 1 123.5 356 V346" />
    <path d="M346 388.5 H356 A32.5 32.5 0 0 0 388.5 356 V346" />
  </g>
  <g fill="#ffffff">
    <rect x="184.75" y="184.75" width="65" height="65" rx="13.75" />
    <rect x="272.25" y="184.75" width="65" height="65" rx="13.75" />
    <rect x="184.75" y="272.25" width="65" height="65" rx="13.75" />
    <rect x="272.25" y="272.25" width="32.5" height="32.5" rx="7.5" />
    <rect x="304.75" y="304.75" width="32.5" height="32.5" rx="7.5" />
  </g>
  <rect x="108.5" y="246" width="295" height="27.5" rx="13.75" fill="#1f6fa8" />
  <rect x="108.5" y="246" width="295" height="6.25" rx="3.125" fill="#ffffff" opacity="0.9" />
</svg>

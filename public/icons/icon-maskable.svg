<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Code Scanner">
  <title>Code Scanner</title>
  <!-- Maskable source. Android crops maskable icons to an arbitrary shape, so
       the background must bleed to every edge, and all meaningful content is
       kept inside the inner 80% "safe zone" (the blue plate spans 78% of the
       canvas, its glyph 62%). Kept as a separate file rather than a CSS
       transform because rasterisation is a one-off, non-CSS tool. -->
  <rect width="512" height="512" fill="#ffffff" />
  <rect x="56" y="56" width="400" height="400" rx="88" fill="#3498db" />
  <g fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="square">
    <path d="M184 150 H176 A26 26 0 0 0 150 176 V184" />
    <path d="M328 150 H336 A26 26 0 0 1 362 176 V184" />
    <path d="M184 362 H176 A26 26 0 0 1 150 336 V328" />
    <path d="M328 362 H336 A26 26 0 0 0 362 336 V328" />
  </g>
  <g fill="#ffffff">
    <rect x="199" y="199" width="52" height="52" rx="11" />
    <rect x="269" y="199" width="52" height="52" rx="11" />
    <rect x="199" y="269" width="52" height="52" rx="11" />
    <rect x="269" y="269" width="26" height="26" rx="6" />
    <rect x="295" y="295" width="26" height="26" rx="6" />
  </g>
  <rect x="138" y="248" width="236" height="22" rx="11" fill="#1f6fa8" />
  <rect x="138" y="248" width="236" height="5" rx="2.5" fill="#ffffff" opacity="0.9" />
</svg>
